<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>D133 UI 原型 · F12 改样式</title>
<!--
  图标来源（全部可免费商用）：
  1. 阿里 iconfont（主力）— https://www.iconfont.cn/
     - 国内 CDN（at.alicdn.com），加载快
     - 免费版可商用（个人上传图标多为 CC BY / 免费授权）
     - 用法：选好图标 → 加入项目 → 生成 SVG Sprite → 贴 script src
     - 本文件内嵌 10 个常用图标的纯 SVG path（避免外部 CDN 依赖）
  2. Lucide Icons — https://lucide.dev/ （iconify 加载）
     - ISC License，宽松开源，可商用
     - 用法：<iconify-icon icon="lucide:xxx"> 自动 CDN 拉取
  ❌ 已排除：所有品牌 logo（DeepSeek / 微信 / 阿里等）— 品牌保留，不得商用
-->
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<!-- 注意：所有 iconfont 图标都已内嵌 SVG path，不依赖外部 CDN -->

<style>
  /* ========== 设计 Token ========== */
  :root{
    --c-bg:#081829; --c-bg2:#0D2A4B;
    --c-panel:#102C49; --c-panel2:#183956;
    --c-edge:#345573;
    --c-white:#F3FAFF; --c-muted:#96B2CA;
    --c-cyan:#36D9EC; --c-blue:#509BFF;
    --c-green:#55D9B0; --c-amber:#FFC878;
    --r-card:17px; --r-panel:16px; --r-badge:34px;
    --f16:16px; --f24:24px; --f36:36px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0f1a;color:#c9d6e5;font-family:"Microsoft YaHei","PingFang SC",sans-serif;padding:32px 24px 80px}
  .pg-label{color:#6f87a0;font-size:13px;margin:0 0 10px 2px}
  .pg-label b{color:var(--c-cyan)}

  .screen{position:relative;width:480px;height:272px;margin-bottom:40px;
          border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,.6),0 0 0 1px #1c2a3d;
          background:linear-gradient(to right,var(--c-bg),var(--c-bg2));user-select:none;overflow:hidden}
  .el{position:absolute}
  .r-card{border-radius:var(--r-card)}.r-panel{border-radius:var(--r-panel)}
  .r-badge{border-radius:var(--r-badge)}
  .r-accent{border-radius:3px}.r-bar{border-radius:3px}
  .f16{font-size:var(--f16);line-height:1.35}
  .f24{font-size:var(--f24);line-height:1.35}
  .f36{font-size:var(--f36);line-height:1.35}
  .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ========== 启动页进度条动画（固定 5s） ========== */
  @keyframes bootFill{
    0%{width:0}
    100%{width:229px}
  }
  .boot-fill{animation:bootFill 5s linear infinite}
</style>
</head>
<body>

<!-- ================================================================
     ① boot.page — 启动页
================================================================ -->
<p class="pg-label"><b>① boot.page</b> — 开机 / 连接中</p>
<div class="screen" id="boot">
  <div class="el r-accent" style="left:18px;top:17px;width:7px;height:23px;background:var(--c-cyan)"></div>
  <div class="el f24 txt" style="left:34px;top:13px;width:126px;color:var(--c-white)">衡山派</div>
  <div class="el" style="left:18px;top:51px;width:444px;height:1px;background:var(--c-edge)"></div>

  <!-- 居中圆形底盘 + Lucide CPU 图标 -->
  <div class="el" style="left:180px;top:64px;width:120px;height:120px;border-radius:60px;border:1px solid var(--c-edge);background:#123A5A"></div>
  <div class="el" id="boot-logo" style="left:180px;top:64px;width:120px;height:120px;display:flex;align-items:center;justify-content:center">
    <!-- Lucide CPU（ISC License），iconify 加载 -->
    <iconify-icon icon="lucide:cpu" style="color:#36D9EC;font-size:76px"></iconify-icon>
  </div>

  <!-- 底部：状态文字 + 进度条（居中） -->
  <div class="el f16 txt" style="left:186px;top:196px;width:108px;color:var(--c-muted);text-align:center">系统初始化</div>
  <div class="el r-bar" style="left:125px;top:230px;width:229px;height:4px;background:#2B4B67"></div>
  <div class="el r-bar boot-fill" style="left:125px;top:230px;width:0;height:4px;background:var(--c-cyan)"></div>
</div>


<!-- ================================================================
     ② main.page — 传感器主页（网络状态合并到右上角）
================================================================ -->
<p class="pg-label"><b>② main.page</b> — 联网后传感器主页</p>
<div class="screen" id="main">
  <div class="el r-accent" style="left:18px;top:17px;width:7px;height:23px;background:var(--c-cyan)"></div>
  <div class="el f24 txt" style="left:34px;top:13px;width:126px;color:var(--c-white)">衡山派</div>
  <!-- 右上角：网络状态（SSID 最多 3 字 + 省略号，后接 WiFi 图标） -->
  <div class="el" style="left:340px;top:17px;width:122px;height:26px;display:flex;align-items:center;justify-content:flex-end;gap:7px">
    <span class="f16 txt" style="max-width:74px;color:var(--c-white)">Hom…</span>
    <!-- WiFi 图标（iconfont 内嵌 path） -->
    <svg viewBox="0 0 1024 1024" width="16" height="16" fill="var(--c-cyan)">
      <path d="M512 160c-183.8 0-348.2 74.2-467.8 193.8l56.6 56.6C210.3 311 353.7 256 512 256s301.7 55 411.2 154.4l56.6-56.6C860.2 234.2 695.8 160 512 160z"/>
      <path d="M512 384c-122.2 0-231.4 49.4-311.8 129.8l56.6 56.6C320 490.2 410.9 448 512 448s192 42.2 255.2 122.4l56.6-56.6C743.4 433.4 634.2 384 512 384z"/>
      <path d="M512 608c-61.1 0-115.7 24.7-155.6 64.6l56.6 56.6c25-25 59.4-41.2 99-41.2s74 16.2 99 41.2l56.6-56.6C627.7 632.7 573.1 608 512 608z"/>
      <circle cx="512" cy="800" r="32"/>
    </svg>
  </div>
  <div class="el" style="left:18px;top:51px;width:444px;height:1px;background:var(--c-edge)"></div>

  <!-- ============ 主卡：温度（大数字 + 趋势线） ============ -->
  <div class="el" style="left:18px;top:64px;width:196px;height:176px;border-radius:16px;
       background:linear-gradient(160deg,#16385A,#0A2140);border:1px solid var(--c-edge)"></div>
  <!-- 图标胶囊 -->
  <div class="el" style="left:36px;top:78px;width:30px;height:30px;border-radius:15px;
       background:rgba(255,200,120,.14);border:1px solid rgba(255,200,120,.45);
       display:flex;align-items:center;justify-content:center">
    <svg viewBox="0 0 1024 1024" width="16" height="16" fill="#FFC878">
      <path d="M736 736V192c0-106-86-192-192-192S352 86 352 192v544c-68 34-128 120-128 216 0 124 100 224 224 224s224-100 224-224c0-96-60-182-128-216z m-64 160c0 35-29 64-64 64s-64-29-64-64v-32c29-12 48-40 48-72V352c0-18-14-32-32-32s-32 14-32 32v340c0 32 19 60 48 72v32c0 35-29 64-64 64s-64-29-64-64c0-72 48-136 112-160V192c0-35 29-64 64-64s64 29 64 64v544c64 24 112 88 112 160z"/>
    </svg>
  </div>
  <div class="el f16 txt" style="left:76px;top:84px;width:60px;color:var(--c-muted)">温度</div>
  <div class="el f36 txt" style="left:34px;top:110px;width:120px;color:var(--c-white)">25.6</div>
  <div class="el f16 txt" style="left:36px;top:148px;width:40px;color:#FFC878">℃</div>
  <!-- 趋势迷你线 -->
  <div class="el" style="left:34px;top:172px;width:164px;height:54px">
    <svg viewBox="0 0 164 54" width="164" height="54" preserveAspectRatio="none">
      <polyline points="0,44 20,38 40,42 60,30 80,26 100,18 120,24 140,12 164,8"
                fill="none" stroke="#FFC878" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
      <polyline points="0,44 20,38 40,42 60,30 80,26 100,18 120,24 140,12 164,8 164,54 0,54"
                fill="#FFC878" opacity=".08" stroke="none"/>
    </svg>
  </div>

  <!-- ============ 右上：湿度 ============ -->
  <div class="el" style="left:226px;top:64px;width:236px;height:84px;border-radius:14px;
       background:linear-gradient(160deg,#16385A,#0A2140);border:1px solid var(--c-edge)"></div>
  <div class="el" style="left:244px;top:76px;width:24px;height:24px;border-radius:12px;
       background:rgba(54,217,236,.14);border:1px solid rgba(54,217,236,.45);
       display:flex;align-items:center;justify-content:center">
    <svg viewBox="0 0 1024 1024" width="13" height="13" fill="#36D9EC">
      <path d="M512 32c-18 0-36 24-100 128-60 96-128 214-128 320 0 166 134 300 284 300s284-134 284-300c0-106-68-224-128-320C548 56 530 32 512 32z m-16 640c-106 0-192-86-192-192 0-72 40-156 96-240 28-42 56-84 80-122 24 38 52 80 80 122 56 84 96 168 96 240 0 106-86 192-192 192z"/>
    </svg>
  </div>
  <div class="el f16 txt" style="left:278px;top:80px;width:60px;color:var(--c-muted)">湿度</div>
  <div class="el f36 txt" style="left:330px;top:94px;width:98px;color:var(--c-white);text-align:right">68</div>
  <div class="el f16 txt" style="left:432px;top:114px;width:20px;color:#36D9EC">%</div>

  <!-- ============ 右下：气压 ============ -->
  <div class="el" style="left:226px;top:156px;width:236px;height:84px;border-radius:14px;
       background:linear-gradient(160deg,#16385A,#0A2140);border:1px solid var(--c-edge)"></div>
  <div class="el" style="left:244px;top:168px;width:24px;height:24px;border-radius:12px;
       background:rgba(85,217,176,.14);border:1px solid rgba(85,217,176,.45);
       display:flex;align-items:center;justify-content:center">
    <svg viewBox="0 0 1024 1024" width="13" height="13" fill="#55D9B0">
      <path d="M512 128c-217 0-384 167-384 384 0 217 167 384 384 384s384-167 384-384S729 128 512 128z m0 704c-177 0-320-143-320-320s143-320 320-320 320 143 320 320-143 320-320 320z"/>
      <path d="M512 320c-18 0-32 14-32 32v160c0 18 14 32 32 32h160c18 0 32-14 32-32s-14-32-32-32H544V352c0-18-14-32-32-32z"/>
    </svg>
  </div>
  <div class="el f16 txt" style="left:278px;top:172px;width:60px;color:var(--c-muted)">气压</div>
  <div class="el f36 txt" style="left:300px;top:186px;width:114px;color:var(--c-white);text-align:right">101.3</div>
  <div class="el f16 txt" style="left:420px;top:206px;width:36px;color:#55D9B0">kPa</div>

  <!-- OTA 面板（默认隐藏） -->
  <div class="el" style="left:18px;top:201px;width:444px;height:45px;
       background:var(--c-panel2);border:1px solid var(--c-edge);border-radius:12px;display:none">
    <div class="el f16 txt" style="left:12px;top:5px;width:88px;color:var(--c-muted)">系统更新</div>
    <div class="el f16 txt" style="left:113px;top:5px;width:300px;color:var(--c-white)">下载并写入 42%</div>
    <div class="el" style="left:12px;top:36px;width:420px;height:4px;background:#31516B;border-radius:2px"></div>
    <div class="el" style="left:12px;top:36px;width:176px;height:4px;background:var(--c-cyan);border-radius:2px"></div>
  </div>

  <div class="el f16 txt" style="left:18px;top:246px;width:440px;color:var(--c-amber)"></div>
</div>


</body>
</html>

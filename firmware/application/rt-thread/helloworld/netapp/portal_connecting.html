<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 0%,#1b4e6f,transparent 40%),#071827;color:#f3faff;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}.card{width:min(100%,420px);border:1px solid #3b6882;border-radius:22px;padding:30px;background:#102e4c;box-shadow:0 24px 50px #00121e77}.ring{width:62px;height:62px;border-radius:50%;border:5px solid #355c78;border-top-color:#47dae8;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:26px;margin:26px 0 12px}p{color:#afcad9;line-height:1.7;font-size:15px}.tip{border-top:1px solid #355b76;margin-top:24px;padding-top:18px;font-size:13px}</style>
